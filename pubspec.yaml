name: cbor
description: A CBOR library for Dart. An RFC8949 compliant encoding/decoding CBOR implementation.
version: 6.5.2
repository: https://github.com/shamblett/cbor
homepage: https://github.com/shamblett/cbor

funding:
  - https://www.darticulate.com/#funding

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  collection: '^1.17.2'
  typed_data: '^1.3.2'
  hex: '^0.2.0'
  convert: '^3.1.2'
  meta: '^1.19.0'
  characters: '^1.4.0'

dev_dependencies:
  test: '^1.33.0'
  lints: '^6.1.0'
  build_runner: '^2.16.2'
  build_test: '^3.5.21'
  build_web_compilers: '^4.8.12'
  ieee754: '^1.0.3'  # For validating custom float_utils implementation in tests
